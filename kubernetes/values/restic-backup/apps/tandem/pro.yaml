# Restic backup configuration for tandem in pro namespace

repository:
  appName: tandem

notifications:
  enabled: true

# PVCs to backup
pvcs:
  - name: pro-tandem-backend-pvc
    mountPath: /backup/tandem

# Deployments to scale down before backup
# Disabled for tandem - PGlite can handle live backups safely (like SQLite WAL mode)
scaleDown:
  enabled: false
  deployments: []
