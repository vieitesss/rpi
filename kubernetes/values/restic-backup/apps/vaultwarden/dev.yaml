# Restic backup configuration for dev namespace

notifications:
  enabled: true

# PVCs to backup
pvcs:
  - name: dev-vaultwarden-pvc
    mountPath: /backup/vaultwarden

# Deployments to scale down before backup
# Disabled for vaultwarden - SQLite WAL mode handles live backups safely
scaleDown:
  enabled: false
  deployments:
    - dev-vaultwarden
