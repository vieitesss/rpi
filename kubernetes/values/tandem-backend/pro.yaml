deployment:
  image: ghcr.io/vieitesss/tandem-backend:0.8.1
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "200m"

ingress:
  enabled: true
  hostname: tandem-backend
  tags: "tag:shared"

# Enable PVC for PGlite data storage
pvc:
  enabled: true
  storage: "5Gi"
  mountPath: "/data"
  storageClassName: local-path-retain
  accessModes:
    - ReadWriteOnce

externalSecrets:
  enabled: true

cm:
  data:
    SUPABASE_URL: https://jtrscdyfuzcccbgvojgb.supabase.co
    PGLITE_DATA_DIR: /data/pglite
    PGLITE_SNAPSHOT_PATH: /data/tandem-db.tar
    PGLITE_SNAPSHOT_INTERVAL_MS: "3600000"
    CORS_ORIGIN: https://tandem-pro.burro-ph.ts.net
