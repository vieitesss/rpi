apiVersion: v1
kind: Pod
metadata:
  name: {{RESTORE_POD_NAME}}
  namespace: {{NAMESPACE}}
spec:
  restartPolicy: Never
  containers:
  - name: restic-restore
    image: {{RESTIC_IMAGE}}
    command:
    - /bin/sh
    - /scripts/restore.sh
    env:
    - name: NAMESPACE
      value: "{{NAMESPACE}}"
    - name: APP_NAME
      value: "{{APP_NAME}}"
    - name: SNAPSHOT_ID
      value: "{{SNAPSHOT_ID}}"
    - name: RESTORE_PATH
      value: "/restore"
    - name: RESTORE_SOURCE_PATH
      value: "{{RESTORE_SOURCE_PATH}}"
    - name: RESTIC_HOST
      value: "{{RESTIC_HOST}}"
    - name: RESTIC_REPOSITORY
      value: "{{RESTIC_REPOSITORY}}"
    envFrom:
    - secretRef:
        name: {{CREDENTIALS_SECRET}}
    volumeMounts:
    - name: scripts
      mountPath: /scripts
    - name: restore-data
      mountPath: /restore
  volumes:
  - name: scripts
    configMap:
      name: {{SCRIPTS_CONFIGMAP}}
      defaultMode: 0755
  - name: restore-data
    persistentVolumeClaim:
      claimName: {{TARGET_PVC}}
