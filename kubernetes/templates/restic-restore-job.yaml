apiVersion: v1
kind: Pod
metadata:
  name: {{RESTORE_POD_NAME}}
  namespace: {{NAMESPACE}}
spec:
  restartPolicy: Never
  containers:
  - name: restic-restore
    image: restic/restic:0.18.1
    command:
    - /bin/sh
    - /scripts/restore.sh
    env:
    - name: SNAPSHOT_ID
      value: "{{SNAPSHOT_ID}}"
    - name: RESTORE_PATH
      value: "/restore"
    - name: RESTIC_REPOSITORY
      value: "{{RESTIC_REPOSITORY}}"
    - name: RESTIC_PASSWORD
      valueFrom:
        secretKeyRef:
          name: {{CREDENTIALS_SECRET}}
          key: RESTIC_PASSWORD
    - name: B2_ACCOUNT_ID
      valueFrom:
        secretKeyRef:
          name: {{CREDENTIALS_SECRET}}
          key: B2_ACCOUNT_ID
    - name: B2_ACCOUNT_KEY
      valueFrom:
        secretKeyRef:
          name: {{CREDENTIALS_SECRET}}
          key: B2_ACCOUNT_KEY
    volumeMounts:
    - name: scripts
      mountPath: /scripts
    - name: restore-data
      mountPath: /restore
  volumes:
  - name: scripts
    configMap:
      name: {{SCRIPTS_CONFIGMAP}}
      defaultMode: 0755
  - name: restore-data
    persistentVolumeClaim:
      claimName: {{TARGET_PVC}}
