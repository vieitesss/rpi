{{- $es := .Values.externalSecrets -}}
{{- if $es.enabled -}}
{{- $ssn := $es.secretStoreName | required ".Values.externalSecrets.secretStoreName is required" -}}
{{- $tn := $es.targetName | required ".Values.externalSecrets.targetName is required" -}}
{{- $data := $es.data | required ".Values.externalSecrets.data is required" -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Namespace }}-{{ .Chart.Name }}-external-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $ssn }}
  target:
    name: {{ $tn }}
    creationPolicy: Owner
  data:
    {{- $data | toYaml | nindent 2 }}
{{- end -}}
