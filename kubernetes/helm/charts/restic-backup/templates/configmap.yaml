apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-scripts
  namespace: {{ .Release.Namespace }}
data:
  backup.sh: |
    #!/bin/sh
    set -e

    echo "========================================="
    echo "Restic Backup Started: $(date)"
    echo "Namespace: {{ .Release.Namespace }}"
    echo "App: {{ .Values.repository.appName }}"
    echo "Repository: b2:{{ .Values.repository.bucket }}:/{{ .Values.repository.basePath }}/{{ .Release.Namespace }}/{{ .Values.repository.appName }}"
    echo "========================================="
    echo ""

    # Add kubectl to PATH
    export PATH="/kubectl-bin:$PATH"

    # Scale down deployments before backup (ensures WAL checkpoint and consistency)
    REPLICA_COUNTS_FILE="/tmp/replica_counts"
    > "$REPLICA_COUNTS_FILE"

    if [ "$SCALE_DOWN_ENABLED" = "true" ] && [ -n "$SCALE_DOWN_DEPLOYMENTS" ]; then
      echo "Scaling down deployments for consistent backup..."

      # Parse comma-separated deployment list
      echo "$SCALE_DOWN_DEPLOYMENTS" | tr ',' '\n' | while read -r deployment; do
        deployment=$(echo "$deployment" | tr -d ' ')
        if [ -n "$deployment" ]; then
          echo "  Checking deployment: $deployment"

          # Get current replica count
          REPLICAS=$(kubectl get deployment "$deployment" -n "$NAMESPACE" -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "0")
          echo "$deployment:$REPLICAS" >> "$REPLICA_COUNTS_FILE"

          # Scale down to 0
          kubectl scale deployment "$deployment" -n "$NAMESPACE" --replicas=0
          echo "  ✓ Scaled down $deployment (was $REPLICAS replicas)"

          # Wait for pods to actually be deleted (ensures WAL checkpoint completes)
          echo "  Waiting for $deployment pods to terminate..."
          kubectl wait --for=delete pod -l app="${NAMESPACE}-${deployment}" -n "$NAMESPACE" --timeout=60s 2>/dev/null || true
          echo "  ✓ Pods deleted"
        fi
      done

      # Additional wait to ensure filesystem sync
      echo ""
      echo "Waiting ${SCALE_DOWN_WAIT_SECONDS}s for filesystem sync..."
      sleep "$SCALE_DOWN_WAIT_SECONDS"
      echo "✓ Filesystem synced"
      echo ""
    fi

    # Cleanup function to scale back up
    cleanup() {
      if [ "$SCALE_DOWN_ENABLED" = "true" ] && [ -f "$REPLICA_COUNTS_FILE" ]; then
        echo ""
        echo "Scaling deployments back up..."
        while IFS=: read -r deployment replicas; do
          if [ -n "$deployment" ] && [ "$replicas" -gt 0 ]; then
            kubectl scale deployment "$deployment" -n "$NAMESPACE" --replicas="$replicas"
            echo "  ✓ Scaled up $deployment to $replicas replicas"
          fi
        done < "$REPLICA_COUNTS_FILE"
        echo "✓ All deployments restored"
      fi
    }

    # Ensure cleanup runs even if backup fails
    trap cleanup EXIT

    # Initialize repository if it doesn't exist
    echo "Checking repository..."
    if ! restic snapshots > /dev/null 2>&1; then
      echo "Repository not found. Initializing..."
      restic init
      echo "Repository initialized successfully"
    fi

    # Backup all mounted PVCs
    echo ""
    echo "Starting backup..."
    restic backup /backup \
      --tag namespace={{ .Release.Namespace }} \
      --tag cronjob={{ .Release.Name }} \
      --host {{ .Release.Namespace }} \
      --verbose

    echo ""
    echo "Backup completed successfully!"

    # Prune old backups according to retention policy
    echo ""
    echo "Pruning old backups..."
    restic forget \
      --keep-daily {{ .Values.repository.retention.keepDaily }} \
      --keep-weekly {{ .Values.repository.retention.keepWeekly }} \
      --keep-monthly {{ .Values.repository.retention.keepMonthly }} \
      --keep-yearly {{ .Values.repository.retention.keepYearly }} \
      --prune \
      --verbose

    echo ""
    echo "Prune completed successfully!"

    {{- if .Values.verify.enabled }}
    # Verify backup integrity
    echo ""
    echo "Verifying backup integrity..."
    restic check --read-data-subset={{ .Values.verify.percentage }}%
    echo "Verification completed successfully!"
    {{- end }}

    # Show latest snapshots
    echo ""
    echo "Latest snapshots:"
    restic snapshots --latest 5

    # Show repository stats
    echo ""
    echo "Repository statistics:"
    restic stats

    echo ""
    echo "========================================="
    echo "Backup job completed: $(date)"
    echo "========================================="

  restore.sh: |
    #!/bin/sh
    set -e

    echo "========================================="
    echo "Restic Restore Started: $(date)"
    echo "Namespace: {{ .Release.Namespace }}"
    echo "App: {{ .Values.repository.appName }}"
    echo "Repository: b2:{{ .Values.repository.bucket }}:/{{ .Values.repository.basePath }}/{{ .Release.Namespace }}/{{ .Values.repository.appName }}"
    echo "========================================="

    # Get snapshot ID from environment variable (defaults to 'latest')
    SNAPSHOT_ID="${SNAPSHOT_ID:-latest}"
    RESTORE_PATH="${RESTORE_PATH:-/restore}"

    echo "Snapshot: $SNAPSHOT_ID"
    echo "Restore path: $RESTORE_PATH"
    echo ""

    # List available snapshots
    echo "Available snapshots:"
    restic snapshots --host {{ .Release.Namespace }}
    echo ""

    # Clean target directory first
    echo "Cleaning target directory..."
    rm -rf "$RESTORE_PATH"/*
    rm -rf "$RESTORE_PATH"/.[!.]*
    mkdir -p "$RESTORE_PATH"
    echo "✓ Target directory cleaned"
    echo ""

    # Restore snapshot
    echo "Restoring snapshot: $SNAPSHOT_ID"
    restic restore "$SNAPSHOT_ID" \
      --target "$RESTORE_PATH" \
      --verbose

    echo ""
    echo "Moving files to correct location..."
    # Move files from nested backup path to root
    if [ -d "$RESTORE_PATH/backup/vaultwarden" ]; then
      mv "$RESTORE_PATH"/backup/vaultwarden/* "$RESTORE_PATH"/
      mv "$RESTORE_PATH"/backup/vaultwarden/.[!.]* "$RESTORE_PATH"/ 2>/dev/null || true
      rm -rf "$RESTORE_PATH"/backup
      echo "✓ Files moved successfully"
    fi

    echo ""
    echo "Restore completed successfully!"
    echo ""
    echo "Restored files:"
    ls -lah "$RESTORE_PATH/"

    echo ""
    echo "========================================="
    echo "Restore job completed: $(date)"
    echo "========================================="

  list.sh: |
    #!/bin/sh
    set -e

    echo "========================================="
    echo "Restic Snapshots"
    echo "Namespace: {{ .Release.Namespace }}"
    echo "App: {{ .Values.repository.appName }}"
    echo "Repository: b2:{{ .Values.repository.bucket }}:/{{ .Values.repository.basePath }}/{{ .Release.Namespace }}/{{ .Values.repository.appName }}"
    echo "========================================="
    echo ""

    # List all snapshots for this namespace
    restic snapshots --host {{ .Release.Namespace }}

    echo ""
    echo "========================================="
    echo "Repository Statistics"
    echo "========================================="
    echo ""

    # Show repository stats
    restic stats
