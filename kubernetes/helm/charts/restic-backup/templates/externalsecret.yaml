{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-external-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "0" | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ .Release.Name }}-credentials
    creationPolicy: Owner
  data:
  - secretKey: B2_ACCOUNT_ID
    remoteRef:
      key: {{ .Values.externalSecrets.b2AccountIdKey }}
  - secretKey: B2_ACCOUNT_KEY
    remoteRef:
      key: {{ .Values.externalSecrets.b2AccountKeyKey }}
  - secretKey: RESTIC_PASSWORD
    remoteRef:
      key: {{ .Values.externalSecrets.resticPasswordKey }}
{{- if .Values.notifications.enabled }}
  - secretKey: NTFY_TOPIC
    remoteRef:
      key: {{ .Values.externalSecrets.ntfyTopicKey }}
{{- end }}
{{- end }}
