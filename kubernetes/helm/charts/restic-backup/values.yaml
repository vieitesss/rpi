# Default values for restic-backup

# Backup schedule (cron format)
schedule: "0 23 * * *"  # Daily at 23:00 UTC
timeZone: "Etc/UTC"

# Restic repository configuration
repository:
  # Base bucket configuration (dynamic per-app repositories)
  # Repository structure: b2:<bucket>:/<basePath>/<namespace>/<appName>
  bucket: "rpi-data"
  basePath: "kubernetes-pvcs"
  
  # Application name for repository isolation
  # Default value used for both dev and pro unless overridden
  # Creates repositories like: b2:rpi-data:/kubernetes-pvcs/dev/vaultwarden
  appName: "vaultwarden"

  # Retention policy (matches Velero/Docker backup retention)
  retention:
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 6
    keepYearly: 1

# PVCs to backup (configure per namespace in values/<namespace>.yaml)
pvcs: []
#  - name: dev-vaultwarden-pvc
#    mountPath: /backup/vaultwarden
#  - name: tailscale-state-pvc
#    mountPath: /backup/tailscale

# Scale down deployments before backup (ensures WAL checkpoint and data consistency)
scaleDown:
  enabled: true
  # List of deployments to scale down (configure per namespace in values/<namespace>.yaml)
  deployments: []
  #  - vaultwarden
  # Wait time in seconds after scaling down before backup
  waitSeconds: 10

# External Secrets configuration
externalSecrets:
  enabled: true
  secretStoreName: gcp-cluster-secretstore
  # GCP Secret Manager secret names
  b2AccountIdKey: rpi-b2-account-id
  b2AccountKeyKey: rpi-b2-account-key
  resticPasswordKey: restic_password
  ntfyTopicKey: ntfy_backup_error

# Failure notifications
notifications:
  enabled: false
  provider: ntfy
  ntfy:
    url: https://ntfy.sh

# CronJob configuration
cronjob:
  # Set true to keep the CronJob for manual runs only
  suspend: false
  # Number of successful/failed jobs to keep
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  # Resource limits
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  # Restic image
  image:
    repository: restic/restic
    tag: "0.18.1"
    pullPolicy: IfNotPresent
