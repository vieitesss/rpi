apiVersion: v1
kind: Service
metadata:
  name: {{ include "vaultwarden.fullName" . }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port | default 80 }}
      targetPort: {{ .Values.service.targetPort | default 80 }}
      protocol: TCP
      name: http
  selector:
    app: {{ include "vaultwarden.fullName" . }}
