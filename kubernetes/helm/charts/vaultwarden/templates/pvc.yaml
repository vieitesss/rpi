{{- $v := .Values.vaultwarden | default dict -}}
{{- $pvc := $v.pvc | default dict -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vaultwarden.fullName" . }}-pvc
spec:
  {{- if $pvc.storageClassName }}
  storageClassName: {{ $pvc.storageClassName }}
  {{- end }}
  accessModes:
    {{- if $pvc.accessModes -}}
    {{ $pvc.accessModes | toYaml | nindent 4 }}
    {{- else }}
    - ReadWriteOnce
    {{- end }}
  resources:
    requests:
      storage: {{ $pvc.storage | default "5Gi" }}
