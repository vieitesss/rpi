{{- if .Values.ingress.enabled }}
{{- $hostname := .Values.ingress.hostname | default .Release.Name }}
{{- $domain := .Values.ingress.domain }}
{{- $fqdn := printf "%s.%s" $hostname $domain }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "generic.fullName" . }}-ingress
  annotations:
    tailscale.com/hostname: {{ $hostname }}
    {{- if .Values.ingress.tags }}
    tailscale.com/tags: {{ .Values.ingress.tags }}
    {{- end }}
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: {{ include "generic.fullName" . }}-svc
      port:
        number: {{ .Values.service.port }}
  tls:
    - hosts:
        - {{ $fqdn }}
{{- end }}
