{{- if .Values.deployment.enabled }}
{{- $fullName := include "generic.fullName" . }}
{{- $volumeName := printf "%s-data" $fullName }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    app: {{ $fullName }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  {{- with .Values.deployment.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $fullName }}
  template:
    metadata:
      annotations:
        {{- if and .Values.velero.enabled .Values.pvc.enabled }}
        backup.velero.io/backup-volumes: {{ $volumeName }}
        {{- end }}
        {{- with .Values.deployment.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app: {{ $fullName }}
    spec:
      {{- if .Values.deployment.hostPID }}
      hostPID: true
      {{- end }}
      volumes:
        {{- if .Values.pvc.enabled }}
        - name: {{ $volumeName }}
          persistentVolumeClaim:
            claimName: {{ include "generic.fullName" . }}-pvc
        {{- end }}
        {{- with .Values.deployment.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.deployment.initContainers }}
      initContainers:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      - name: {{ .Release.Name }}
        image: {{ .Values.deployment.image | required "deployment.image is required" }}
        resources:
          {{- toYaml .Values.deployment.resources | nindent 10 }}
        {{- with .Values.deployment.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
          - containerPort: {{ .Values.service.targetPort }}
        {{- with .Values.deployment.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.deployment.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.deployment.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
          {{- if .Values.pvc.enabled }}
          - name: {{ $volumeName }}
            mountPath: {{ .Values.pvc.mountPath }}
          {{- end }}
          {{- with .Values.deployment.extraVolumeMounts }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        envFrom:
          {{- if .Values.cm.data }}
          - configMapRef:
              name: {{ $fullName }}-cm
          {{- end }}
          {{- if .Values.secret.data }}
          - secretRef:
              name: {{ $fullName }}-secret
          {{- end }}
          {{- if .Values.externalSecrets.enabled }}
          - secretRef:
              name: {{ default (printf "%s-external-secret" $fullName) .Values.externalSecrets.targetName }}
          {{- end }}
        {{- with .Values.deployment.env }}
        env:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{- end }}
