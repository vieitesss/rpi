{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "generic.fullName" . }}-external-secret
  labels:
    app: {{ include "generic.fullName" . }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ default (printf "%s-external-secret" (include "generic.fullName" .)) .Values.externalSecrets.targetName }}
    creationPolicy: Owner
  data:
  {{- range .Values.externalSecrets.data }}
  - secretKey: {{ .secretKey }}
    remoteRef:
      key: {{ .remoteKey }}
      {{- with .property }}
      property: {{ . }}
      {{- end }}
  {{- end }}
{{- end }}
