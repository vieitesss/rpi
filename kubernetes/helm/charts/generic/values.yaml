cm:
  data: {}

secret:
  data: {}

externalSecrets:
  enabled: false
  secretStoreName: gcp-cluster-secretstore
  refreshInterval: 1h
  targetName: ""
  data: []

deployment:
  enabled: true
  replicas: 1
  # required
  image: ""
  strategy: {}
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  readinessProbe: {}
  livenessProbe: {}
  startupProbe: {}
  securityContext: {}
  initContainers: []
  extraVolumes: []
  extraVolumeMounts: []

service:
  enabled: true
  port: 80
  targetPort: 80

ingress:
  enabled: true
  # defaults to the release name
  hostname: ""
  domain: burro-ph.ts.net
  tags: ""

pvc:
  enabled: false
  storageClassName: local-path-retain
  accessModes:
    - ReadWriteOnce
  storage: "5Gi"
  mountPath: "/data"

velero:
  enabled: false
