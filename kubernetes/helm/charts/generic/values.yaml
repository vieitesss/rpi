cm:
  data: {}

# File-oriented ConfigMap mounted at configFilesMountPath (filename: contents).
# Use for apps that read YAML/config files from a directory (e.g. Homepage).
configFiles: {}
configFilesMountPath: ""

secret:
  data: {}

externalSecrets:
  enabled: false
  secretStoreName: gcp-cluster-secretstore
  refreshInterval: "0"  # GCP Secret Manager cost control: 0 = no periodic refresh, re-sync release on rotation
  targetName: ""
  data: []

deployment:
  enabled: true
  replicas: 1
  # required when deployment.enabled=true and cronJob.image is empty
  image: ""
  hostPID: false
  strategy: {}
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  readinessProbe: {}
  livenessProbe: {}
  startupProbe: {}
  securityContext: {}
  initContainers: []
  extraVolumes: []
  extraVolumeMounts: []

cronJob:
  enabled: false
  schedule: "0 0 * * *"
  timeZone: "Etc/UTC"
  suspend: false
  concurrencyPolicy: Forbid
  restartPolicy: OnFailure
  backoffLimit: 6 # k8s default; set 0 for jobs where a failed run must not retry.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  image: ""
  imagePullPolicy: IfNotPresent
  command: []
  args: []
  env: []
  resources: {}
  extraVolumes: []
  extraVolumeMounts: []

service:
  enabled: true
  port: 80
  targetPort: 80

ingress:
  enabled: true
  # defaults to the release name
  hostname: ""
  domain: burro-ph.ts.net
  tags: ""

pvc:
  enabled: false
  storageClassName: local-path-retain
  accessModes:
    - ReadWriteOnce
  storage: "5Gi"
  mountPath: "/data"

velero:
  enabled: false
